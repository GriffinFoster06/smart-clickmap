<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Click Maps - OBS Overlay</title>
    <style>
        /* OBS Overlay Styles - Optimized for streaming */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #cv {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
            /* Optimize canvas for streaming */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Error display styles */
        .error-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 68, 68, 0.9);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            max-width: 80%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Loading indicator */
        .loading-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 46, 0.9);
            color: #00FFFF;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            border-left: 3px solid #00FFFF;
            z-index: 999;
            transition: opacity 0.3s ease;
        }

            .loading-overlay.hidden {
                opacity: 0;
                pointer-events: none;
            }

        /* Debug info overlay (only in debug mode) */
        .debug-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
            z-index: 998;
            border: 1px solid #333;
            max-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

            .debug-overlay.visible {
                opacity: 0.8;
            }

        .debug-line {
            margin: 2px 0;
        }

        .debug-label {
            color: #61dafb;
        }

        .debug-value {
            color: #f7df1e;
        }

        /* Status indicator */
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            z-index: 997;
            transition: all 0.3s ease;
        }

            .status-indicator.running {
                background: #48bb78;
                box-shadow: 0 0 10px rgba(72, 187, 120, 0.6);
                animation: pulse-green 2s ease-in-out infinite;
            }

            .status-indicator.stopped {
                background: #f56565;
                box-shadow: 0 0 10px rgba(245, 101, 101, 0.6);
            }

            .status-indicator.error {
                background: #ed8936;
                box-shadow: 0 0 10px rgba(237, 137, 54, 0.6);
                animation: pulse-orange 1s ease-in-out infinite;
            }

        @keyframes pulse-green {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
        }

        @keyframes pulse-orange {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Hide everything during print */
        @media print {
            body {
                display: none;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Main canvas for heatmap rendering -->
    <canvas id="cv" width="1920" height="1080"></canvas>

    <!-- Loading indicator -->
    <div id="loading" class="loading-overlay">
        🚀 Loading Ex Machina Click Maps...
    </div>

    <!-- Status indicator -->
    <div id="status" class="status-indicator stopped"></div>

    <!-- Debug overlay (shown only in debug mode) -->
    <div id="debug" class="debug-overlay">
        <div class="debug-line">
            <span class="debug-label">Ex Machina OBS Overlay</span>
        </div>
        <div class="debug-line">
            Channel: <span class="debug-value" id="debug-channel">-</span>
        </div>
        <div class="debug-line">
            Status: <span class="debug-value" id="debug-status">Initializing</span>
        </div>
        <div class="debug-line">
            Clusters: <span class="debug-value" id="debug-clusters">0</span>
        </div>
        <div class="debug-line">
            Clicks: <span class="debug-value" id="debug-clicks">0</span>
        </div>
        <div class="debug-line">
            Users: <span class="debug-value" id="debug-users">0</span>
        </div>
        <div class="debug-line">
            Canvas: <span class="debug-value" id="debug-canvas">-</span>
        </div>
        <div class="debug-line">
            Version: <span class="debug-value">v2.0</span>
        </div>
    </div>

    <script type="module">
        // Initialize the overlay system
        console.log('🎬 Ex Machina OBS Overlay starting...');

        // Check for debug mode
        const isDebugMode = new URLSearchParams(location.search).has('debug');
        const channelId = new URLSearchParams(location.search).get('channel');

        // Show debug overlay if in debug mode
        if (isDebugMode) {
            document.getElementById('debug').classList.add('visible');
            document.getElementById('debug-channel').textContent = channelId || 'Not specified';
            console.log('🐛 Debug mode enabled');
        }

        // Update debug info function
        function updateDebugInfo(stats) {
            if (!isDebugMode) return;

            document.getElementById('debug-status').textContent = stats.running ? 'Running' : 'Stopped';
            document.getElementById('debug-clusters').textContent = stats.clusters || 0;
            document.getElementById('debug-clicks').textContent = stats.totalClicks || 0;
            document.getElementById('debug-users').textContent = stats.uniqueUsers || 0;
            document.getElementById('debug-canvas').textContent =
                `${stats.canvasSize?.width || 0}x${stats.canvasSize?.height || 0}`;
        }

        // Update status indicator
        function updateStatusIndicator(running, hasError = false) {
            const indicator = document.getElementById('status');

            if (hasError) {
                indicator.className = 'status-indicator error';
            } else if (running) {
                indicator.className = 'status-indicator running';
            } else {
                indicator.className = 'status-indicator stopped';
            }
        }

        // Hide loading indicator after a delay
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 2000);

        // Error handling
        window.addEventListener('error', (event) => {
            console.error('🎬 OBS Overlay Error:', event.error);
            updateStatusIndicator(false, true);

            if (isDebugMode) {
                document.getElementById('debug-status').textContent = 'Error: ' + event.error.message;
            }
        });

        // Monitor overlay stats (if available)
        setInterval(() => {
            if (window.obsOverlay) {
                const stats = window.obsOverlay.getStats();
                updateDebugInfo(stats);
                updateStatusIndicator(stats.running, false);
            }
        }, 1000);

        // Canvas context lost/restored handling
        const canvas = document.getElementById('cv');

        canvas.addEventListener('webglcontextlost', (event) => {
            console.warn('🎬 Canvas context lost');
            event.preventDefault();
            updateStatusIndicator(false, true);
        });

        canvas.addEventListener('webglcontextrestored', () => {
            console.log('🎬 Canvas context restored');
            if (window.obsOverlay) {
                window.obsOverlay.renderer.handleResize();
            }
        });

        // Performance monitoring
        let lastFrameTime = performance.now();
        let frameCount = 0;

        function monitorPerformance() {
            frameCount++;
            const now = performance.now();

            // Log performance every 10 seconds
            if (now - lastFrameTime > 10000) {
                const fps = Math.round(frameCount / (now - lastFrameTime) * 1000);
                console.log(`🎬 OBS Performance: ~${fps} FPS`);

                if (isDebugMode) {
                    console.log(`🎬 Memory usage:`, {
                        used: Math.round(performance.memory?.usedJSHeapSize / 1024 / 1024) + 'MB',
                        total: Math.round(performance.memory?.totalJSHeapSize / 1024 / 1024) + 'MB',
                        limit: Math.round(performance.memory?.jsHeapSizeLimit / 1024 / 1024) + 'MB'
                    });
                }

                frameCount = 0;
                lastFrameTime = now;
            }

            requestAnimationFrame(monitorPerformance);
        }

        // Start performance monitoring
        requestAnimationFrame(monitorPerformance);

        // Visibility API handling
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('🎬 OBS Overlay hidden (browser minimized/tab switched)');
            } else {
                console.log('🎬 OBS Overlay visible');
                // Force canvas update when becoming visible
                if (window.obsOverlay) {
                    window.obsOverlay.renderClusters();
                }
            }
        });

        // Display usage instructions if no channel specified
        if (!channelId) {
            setTimeout(() => {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-overlay';
                errorDiv.innerHTML = `
                        <div style="margin-bottom: 10px;">❌ Channel ID Required</div>
                        <div style="font-size: 14px; font-weight: normal;">
                            Add <strong>?channel=YOUR_CHANNEL_ID</strong> to the URL<br>
                            <br>
                            Example:<br>
                            <code style="background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 3px;">
                                ?channel=phummylw&debug
                            </code>
                        </div>
                    `;
                document.body.appendChild(errorDiv);

                updateStatusIndicator(false, true);
            }, 1000);
        }

        console.log(`🎬 Ex Machina OBS Overlay initialized ${isDebugMode ? '(Debug Mode)' : ''}`);
        console.log(`📺 Channel: ${channelId || 'Not specified'}`);
        console.log(`🖼️  Canvas: ${canvas.width}x${canvas.height}`);
    </script>

    <!-- Load the main overlay script -->
    <script type="module" src="overlay.js"></script>
</body>
</html>
