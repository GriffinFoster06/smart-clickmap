<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>ClickMap Viewer</title>
    <style>
        body, html {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            /* Transparent but clickable */
            background-color: transparent;
        }
    </style>
</head>
<body>
    <iframe id="player"
            style="width:100%; height:100%;"
            frameborder="0"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin"
            scrolling="no"
            title="Interactive ClickMap Viewer">
    </iframe>
    <canvas id="heat"
            style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">
    </canvas>
    <div id="click-overlay"></div>
    <script type="module" src="/click.js" onerror="console.error('Failed to load /click.js');"></script>
</body>
</html>
