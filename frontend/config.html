<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMap Control Panel</title>

    <!-- Twitch Extension Helper Library - MUST LOAD FIRST -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <!-- Config Panel Styles -->
    <link rel="stylesheet" href="config.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>ClickMap</h1>
        <div class="subtitle">Interactive overlay control panel</div>
    </div>

    <!-- Error Display -->
    <div class="error-message" id="error" style="display: none;">
        Connection error. Retrying...
    </div>

    <!-- Status Section -->
    <div class="status-section">
        <div class="status-indicator" id="status">
            <div class="status-dot"></div>
            <span id="status-text">Initializing...</span>
        </div>
    </div>

    <!-- Statistics -->
    <div class="stats-section">
        <div class="stat-card">
            <span class="stat-value" id="total-clicks">-</span>
            <div class="stat-label">Total Clicks</div>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="unique-users">-</span>
            <div class="stat-label">Users</div>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="cluster-count">-</span>
            <div class="stat-label">Clusters</div>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="coverage">-</span>
            <div class="stat-label">Coverage</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-section">
        <div class="controls-header">Overlay Controls</div>
        <div class="controls">
            <div class="control-row">
                <button id="start-btn">▶️ Start</button>
                <button id="stop-btn" class="secondary">⏹️ Stop</button>
            </div>
            <button id="reset-btn" class="danger">🗑️ Reset</button>
        </div>
    </div>

    <!-- Overlay Settings -->
    <div class="overlay-controls">
        <h3>Settings</h3>
        <div class="control-group">
            <span class="control-label">Server</span>
            <span class="control-value" id="server-status">Connected</span>
        </div>
        <div class="control-group">
            <span class="control-label">Overlay</span>
            <span class="control-value" id="overlay-status">Ready</span>
        </div>
        <div class="control-group">
            <span class="control-label">Threshold</span>
            <span class="control-value" id="threshold-value">3%</span>
        </div>
        <div class="control-group">
            <span class="control-label">Last Update</span>
            <span class="control-value" id="last-update">-</span>
        </div>
    </div>

    <!-- Load modules after a short delay to ensure Twitch loads first -->
    <script>
        function loadConfigModules() {
            console.log('🎛️ Loading Config Panel modules...');

            const scripts = [
                'heatmap.js',
                'config.js'
            ];

            // Load modules sequentially
            let loadIndex = 0;
            function loadNext() {
                if (loadIndex >= scripts.length) {
                    console.log('✅ All Config Panel modules loaded');
                    return;
                }

                const script = document.createElement('script');
                script.type = 'module';
                script.src = scripts[loadIndex];
                script.onload = function () {
                    console.log(`✅ Config: Loaded: ${scripts[loadIndex]}`);
                    loadIndex++;
                    loadNext();
                };
                script.onerror = function () {
                    console.error(`❌ Config: Failed to load: ${scripts[loadIndex]}`);
                    loadIndex++;
                    loadNext();
                };
                document.head.appendChild(script);
            }

            loadNext();
        }

        // Start loading process after DOM is ready with small delay for Twitch
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                // Small delay to let Twitch Extension Helper settle
                setTimeout(loadConfigModules, 100);
            });
        } else {
            setTimeout(loadConfigModules, 100);
        }
    </script>
</body>
</html>
