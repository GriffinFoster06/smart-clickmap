<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Click Maps</title>

    <!-- Twitch Extension Helper Library -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <style>
        /* Smart Click Maps Overlay Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Main canvas for heatmap overlay */
        #heat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 1000;
            cursor: crosshair;
            /* High quality canvas rendering */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

            /* When system is not running, show different cursor */
            #heat.inactive {
                cursor: not-allowed;
                opacity: 0.8;
            }

        /* Notification styles */
        .ex-machina-overlay-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(110%);
            max-width: 300px;
            word-wrap: break-word;
        }

            .ex-machina-overlay-notification.show {
                opacity: 1;
                transform: translateX(0);
            }

            .ex-machina-overlay-notification.success {
                border-left: 4px solid #48bb78;
                background: rgba(30, 46, 30, 0.95);
            }

            .ex-machina-overlay-notification.error {
                border-left: 4px solid #f56565;
                background: rgba(46, 30, 30, 0.95);
            }

            .ex-machina-overlay-notification.info {
                border-left: 4px solid #4299e1;
                background: rgba(30, 39, 46, 0.95);
            }

        /* Status indicator */
        .ex-machina-status {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(30, 30, 46, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1800;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .ex-machina-status.visible {
                opacity: 1;
            }

            .ex-machina-status.running {
                border-left: 3px solid #48bb78;
                color: #48bb78;
            }

            .ex-machina-status.stopped {
                border-left: 3px solid #f56565;
                color: #f56565;
            }

        .ex-machina-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: ex-machina-status-pulse 2s ease-in-out infinite;
        }

        .ex-machina-status.running .ex-machina-status-dot {
            background: #48bb78;
        }

        .ex-machina-status.stopped .ex-machina-status-dot {
            background: #f56565;
        }

        @keyframes ex-machina-status-pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
        }

        /* Debug info overlay */
        .ex-machina-debug {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            z-index: 1900;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 250px;
            border: 1px solid #333;
        }

            .ex-machina-debug.visible {
                opacity: 0.8;
            }

        /* Loading indicator */
        .ex-machina-loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            color: white;
            font-size: 16px;
            z-index: 3000;
            text-align: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

            .ex-machina-loading.hidden {
                opacity: 0;
                pointer-events: none;
            }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #48bb78;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .ex-machina-overlay-notification {
                top: 10px;
                right: 10px;
                left: 10px;
                transform: translateY(-110%);
                max-width: none;
            }

                .ex-machina-overlay-notification.show {
                    transform: translateY(0);
                }

            .ex-machina-status {
                top: 10px;
                left: 10px;
                font-size: 10px;
            }

            #heat {
                cursor: pointer;
            }
        }

        /* High contrast mode */
        @media (prefers-contrast: high) {
            .ex-machina-overlay-notification,
            .ex-machina-status,
            .ex-machina-debug,
            .ex-machina-loading {
                background: rgba(0, 0, 0, 0.95) !important;
                border: 2px solid white !important;
                color: white !important;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Loading indicator -->
    <div id="ex-machina-loading" class="ex-machina-loading">
        <div class="loading-spinner"></div>
        Initializing  Smart Click Maps...
    </div>

    <!-- Main heatmap canvas -->
    <canvas id="heat" width="1920" height="1080" title=" Smart Click Maps - Click to participate!"></canvas>

    <!-- Status indicator -->
    <div id="ex-machina-status" class="ex-machina-status">
        <div class="ex-machina-status-dot"></div>
        <span id="ex-machina-status-text">Initializing...</span>
    </div>

    <!-- Debug information -->
    <div id="ex-machina-debug" class="ex-machina-debug">
        <div> Smart Click Maps v2.0</div>
        <div>Status: <span id="debug-status">Loading...</span></div>
        <div>Clusters: <span id="debug-clusters">0</span></div>
        <div>Clicks: <span id="debug-clicks">0</span></div>
        <div>WebSocket: <span id="debug-ws">Connecting...</span></div>
        <div>Channel: <span id="debug-channel">Unknown</span></div>
        <div>Auth: <span id="debug-auth">Waiting...</span></div>
    </div>

    <!--  Smart Click Maps Script -->
    <script type="module">
        // Global error handler
        window.addEventListener('error', (event) => {
            console.error('🚨 Global error:', event.error);
            showError('System Error: ' + event.error.message);
        });

        // Check for debug mode
        const isDebugMode = new URLSearchParams(location.search).has('debug');

        if (isDebugMode) {
            document.getElementById('ex-machina-debug').classList.add('visible');
            console.log('🐛  Debug Mode Enabled');
        }

        // Show loading screen
        const loadingScreen = document.getElementById('ex-machina-loading');

        function hideLoading() {
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
                if (loadingScreen.parentNode) {
                    loadingScreen.parentNode.removeChild(loadingScreen);
                }
            }, 300);
        }

        function showError(message) {
            loadingScreen.innerHTML = `
                    <div style="color: #f56565; font-weight: bold;">❌ ${message}</div>
                    <div style="font-size: 12px; margin-top: 10px; opacity: 0.7;">
                        Check browser console for details
                    </div>
                `;
        }

        // Listen for status updates
        window.addEventListener('ex-machina-status-update', (event) => {
            const { status, running } = event.detail;

            if (isDebugMode) {
                document.getElementById('debug-status').textContent = status;
            }

            const statusElement = document.getElementById('ex-machina-status-text');
            const statusContainer = document.getElementById('ex-machina-status');

            if (statusElement) statusElement.textContent = status;
            if (statusContainer && running !== null) {
                statusContainer.className = `ex-machina-status visible ${running ? 'running' : 'stopped'}`;
            }
        });

        // Listen for WebSocket updates
        window.addEventListener('ex-machina-ws-status', (event) => {
            if (isDebugMode) {
                document.getElementById('debug-ws').textContent = event.detail.status;
            }
        });

        // Listen for cluster updates
        window.addEventListener('ex-machina-clusters-update', (event) => {
            if (isDebugMode) {
                document.getElementById('debug-clusters').textContent = event.detail.count || 0;
                document.getElementById('debug-clicks').textContent = event.detail.clicks || 0;
            }
        });

        // Initialize  System
        try {
            console.log('🚀 Loading  Smart Click Maps...');

            // Load the main script
            const script = document.createElement('script');
            script.type = 'module';
            script.src = './script.js';

            script.onload = () => {
                console.log('✅  script loaded successfully');
                hideLoading();

                // Update debug info with initial values
                if (isDebugMode) {
                    setTimeout(() => {
                        if (window.exMachinaClickMap) {
                            const stats = window.exMachinaClickMap.getStats();
                            document.getElementById('debug-channel').textContent = stats.channelId || 'Unknown';
                            document.getElementById('debug-auth').textContent = stats.hasAuth ? 'Yes' : 'No';
                        }
                    }, 1000);
                }
            };

            script.onerror = (error) => {
                console.error('❌ Failed to load  script:', error);
                showError('Failed to load system script');
            };

            document.head.appendChild(script);

        } catch (error) {
            console.error('❌ Failed to initialize :', error);
            showError('Initialization failed');
        }

        // Keyboard shortcuts for debugging
        if (isDebugMode) {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'i' && e.ctrlKey && e.shiftKey) {
                    // Show debug info
                    console.table({
                        'Canvas Element': document.getElementById('heat'),
                        'Viewport': `${window.innerWidth}x${window.innerHeight}`,
                        'Device Pixel Ratio': window.devicePixelRatio,
                        'User Agent': navigator.userAgent,
                        'Online': navigator.onLine,
                        'Twitch Extension': !!window.Twitch?.ext
                    });
                    e.preventDefault();
                }
            });
        }

        console.log(`🎯  Smart Click Maps v2.0 ${isDebugMode ? '(Debug Mode)' : ''}`);
    </script>
</body>
</html>
