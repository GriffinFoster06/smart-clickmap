<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Clickmap Overlay</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: transparent;
            z-index: 1
        }
    </style>
</head>
<body>
    <canvas id="heat" width="1920" height="1080"></canvas>

    <script type="module" src="/js/overlay.js"></script>
</body>
</html>
