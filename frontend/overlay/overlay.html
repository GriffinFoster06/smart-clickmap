<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMap Overlay</title>

    <!-- Twitch Extension Helper Library - MUST LOAD FIRST -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Hidden loading (only visible in console) */
        .loading {
            display: none;
        }

        /* Hidden error message */
        .error-message {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Only the canvas - nothing else visible -->
    <canvas id="overlay-canvas"></canvas>

    <!-- Hidden elements for error handling -->
    <div class="loading" id="loading"></div>
    <div class="error-message" id="error">
        <p>Connection error</p>
    </div>

    <!-- Load overlay script after small delay for Twitch -->
    <script>
        function loadOverlayScript() {
            console.log('🖼️ Loading overlay script...');

            const script = document.createElement('script');
            script.src = 'overlay.js';
            script.onload = function () {
                console.log('✅ Overlay script loaded');
            };
            script.onerror = function () {
                console.error('❌ Failed to load overlay script');
            };
            document.head.appendChild(script);
        }

        // Start loading process after DOM is ready with small delay for Twitch
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                // Small delay to let Twitch Extension Helper settle
                setTimeout(loadOverlayScript, 100);
            });
        } else {
            setTimeout(loadOverlayScript, 100);
        }
    </script>
</body>
</html>
