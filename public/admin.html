<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clickmap Admin</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            padding: 2rem;
        }

        #stats {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        #heat {
            width: 640px;
            height: 360px;
            border: 1px solid #333;
            display: block;
            margin-bottom: 1rem;
        }

        #controls button {
            margin-right: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
        }

        details {
            margin-top: 1.5rem;
            border: 1px solid #333;
            padding: 0.5rem;
            width: 660px;
        }

        label {
            display: block;
            margin: 0.5rem 0;
        }

        input[type="number"] {
            width: 4rem;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Clickmap Admin</h1>

    <div id="stats">
        <span id="clicks">0 unique</span> |
        <span id="unique">0 unique</span> |
        <strong id="state" style="color:lime;">RUNNING</strong>
    </div>

    <canvas id="heat" width="1920" height="1080"></canvas>

    <div id="controls">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset</button>
    </div>

    <details>
        <summary>Advanced Config</summary>
        <label>
            Min % shown:
            <input id="cfgPct" type="number" min="0" max="100" step="1" value="5">
        </label>
        <label>
            Max clusters:
            <input id="cfgMax" type="number" min="1" max="50" step="1" value="10">
        </label>
        <label>
            Refresh rate (ms):
            <input id="cfgRate" type="number" min="200" max="10000" step="100" value="2000">
        </label>
        <button id="applyCfg">Apply (reload admin)</button>
        <button id="openViewer">Open Viewer</button>
        <button id="openOverlay">Open Overlay</button>
    </details>

    <script type="module" src="/js/cluster.js"></script>
    <script type="module" src="/js/heatmap.js"></script>
    <script type="module" src="/js/admin.js"></script>
</body>
</html>
