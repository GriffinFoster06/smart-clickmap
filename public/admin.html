<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Click-Map Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div id="stats">
        <span id="clicks">0 clicks</span> |
        <span id="state" style="font-weight:bold;color:#0f0;">RUNNING</span>
    </div>

    <canvas id="heat" width="240" height="135"></canvas>

    <div id="controls">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset</button>
    </div>

    <!-- Advanced Config -->
    <details style="margin-top:1rem">
        <summary>Advanced Config</summary>
        <label>Min % to show: <input id="cfgPct" type="number" min="1" max="100" value="5"></label><br>
        <label>Max clusters: <input id="cfgMax" type="number" min="1" max="50" value="10"></label><br>
        <label>Min radius: <input id="cfgMinR" type="number" min="1" max="100" value="12"></label><br>
        <label>Scale factor: <input id="cfgK" type="number" min="1" max="20" value="8"></label><br>
        <button id="applyCfg">Apply & Reload</button>
    </details>

    <script type="module" src="/js/admin.js"></script>
</body>
</html>
