<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Overlay</title>
    <style>
        body, html {
            margin: 0;
            background: transparent
        }
    </style>
</head>
<body>
    <canvas id="heat" width="1920" height="1080"></canvas>
    <script type="module">
        import { drawBlobs } from './heatmap.js';
        const chan = location.pathname.split('/').pop().toLowerCase();
        const ctx = document.getElementById('heat').getContext('2d');
        const api = '';
        async function poll() {
            const r = await fetch(`${api}/heatmap/${chan}`); const j = await r.json();
            drawBlobs(ctx, j.blobs || []);
        }
        setInterval(poll, 1000); poll();
    </script>
</body>
</html>
