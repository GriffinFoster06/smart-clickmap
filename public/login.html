<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Streamer Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh
        }

        form {
            background: #222;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,.6);
            display: flex;
            flex-direction: column;
            gap: 1rem
        }

        input, button {
            padding: .6rem;
            font-size: 1rem;
            width: 200px
        }

            button[type="submit"] {
                background: #0a84ff;
                border: none;
                color: white;
                cursor: pointer
            }

        #pwToggle {
            background: none;
            border: none;
            color: #0a84ff;
            font-size: 1.2rem;
            cursor: pointer;
            position: absolute;
            right: 6px;
            top: 6px
        }
    </style>
</head>
<body>
    <form method="POST" action="/login">
        <h2>Clickmap Admin Login</h2>
        <input name="username" placeholder="Username" required>
        <div style="position:relative">
            <input id="pw" name="password" type="password" placeholder="Password" required>
            <button id="pwToggle" type="button">👁️</button>
        </div>
        <button type="submit">Log in</button>
    </form>

    <script>
        document.getElementById('pwToggle').onclick = () => {
            const pw = document.getElementById('pw');
            pw.type = pw.type === 'password' ? 'text' : 'password';
            document.getElementById('pwToggle').textContent = pw.type === 'text' ? '🙈' : '👁️';
        };
    </script>
</body>
</html>
