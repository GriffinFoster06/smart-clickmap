<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Click Maps Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }

        #stats {
            margin-bottom: 20px;
            font-size: 18px;
        }

            #stats div {
                margin: 5px 0;
            }

        button {
            font-size: 20px;
            padding: 10px 20px;
            background-color: #9147ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

            button:hover {
                background-color: #772ce8;
            }
    </style>
</head>
<body>

    <div id="stats">
        <div id="clicks">Clicks: 0</div>
        <div id="users">Users: 0</div>
        <div id="blobs">Blobs: 0</div>
    </div>

    <button id="restart">Restart</button>

    <script type="module" src="config.js"></script>

</body>
</html>
