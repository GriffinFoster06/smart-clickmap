<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Smart Click Maps</title>

    <!-- Twitch Extension Helper Library -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #heat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 1000;
            cursor: crosshair;
        }

            #heat.inactive {
                cursor: not-allowed;
                opacity: 0.8;
            }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateX(110%);
            transition: all 0.3s ease;
        }

            .notification.show {
                opacity: 1;
                transform: translateX(0);
            }

            .notification.success {
                border-left: 4px solid #48bb78;
            }

            .notification.error {
                border-left: 4px solid #f56565;
            }

            .notification.info {
                border-left: 4px solid #4299e1;
            }

        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            z-index: 1900;
            display: none;
        }

            .debug-info.visible {
                display: block;
            }
    </style>
</head>
<body>
    <canvas id="heat" width="1920" height="1080"></canvas>

    <div id="debug-info" class="debug-info">
        <div> Smart Click Maps v2.0</div>
        <div>Status: <span id="debug-status">Loading...</span></div>
        <div>Auth: <span id="debug-auth">Waiting...</span></div>
        <div>Channel: <span id="debug-channel">Unknown</span></div>
        <div>Clicks: <span id="debug-clicks">0</span></div>
        <div>Clusters: <span id="debug-clusters">0</span></div>
        <div>WebSocket: <span id="debug-ws">Disconnected</span></div>
        <div>Rendering: <span id="debug-render">Not started</span></div>
    </div>

    <script type="module">
        // Import our proper heatmap classes
        import { ExMachinaRenderer, ExMachinaClusterer } from './heatmap.js';

        // Debug mode
        const DEBUG = new URLSearchParams(location.search).has('debug');
        if (DEBUG) {
            document.getElementById('debug-info').classList.add('visible');
            console.log('🐛 Debug mode enabled');
        }

        // Global state
        let authToken = '';
        let channelId = '';
        let running = false;

        // Backend config
        const EBS = 'https://smart-clickmap-backend.onrender.com';
        const wsUrl = EBS.replace('https://', 'wss://');

        // Canvas and rendering
        const canvas = document.getElementById('heat');
        const renderer = new ExMachinaRenderer(canvas);
        const clusterer = new ExMachinaClusterer({
            epsilon: 0.08,
            minPts: 1,  // Allow single clicks to form clusters!
            maxClusters: 8,
            minPercentage: 1  // Show even 1% clusters for testing
        });

        console.log('✅  renderer and clusterer initialized');
        updateDebugInfo('render', 'Ready');

        // WebSocket
        let ws = null;
        let pollInterval = null;
        let reconnectAttempts = 0;

        // Current data
        let currentClusters = [];
        let rawClicks = [];

        function updateDebugInfo(key, value) {
            if (DEBUG) {
                const element = document.getElementById(`debug-${key}`);
                if (element) element.textContent = value;
            }
        }

        function showNotification(message, type = 'info') {
            console.log(`📢 ${type.toUpperCase()}: ${message}`);

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 10);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.parentNode?.removeChild(notification), 300);
            }, 3000);
        }

        // Connect WebSocket
        function connectWebSocket() {
            if (!channelId) {
                console.log('❌ Cannot connect WebSocket: no channelId');
                return;
            }

            try {
                const url = `${wsUrl}?channel=${encodeURIComponent(channelId)}`;
                console.log('🔌 Connecting WebSocket:', url);

                ws = new WebSocket(url);

                ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    updateDebugInfo('ws', 'Connected');
                    reconnectAttempts = 0;
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📨 WebSocket message:', data);

                        if (data.type === 'status') {
                            const wasRunning = running;
                            running = data.data.running;
                            console.log(`📊 Status: ${running ? 'RUNNING' : 'STOPPED'}`);
                            updateDebugInfo('status', running ? 'Running' : 'Stopped');
                            canvas.className = running ? '' : 'inactive';

                            if (wasRunning !== running) {
                                showNotification(running ? 'Mapping started' : 'Mapping stopped', 'info');
                            }
                        } else if (data.type === 'reset') {
                            console.log('🗑️ Reset received');
                            rawClicks = [];
                            currentClusters = [];
                            updateClusters();
                        } else if (data.type === 'click') {
                            console.log('👆 Real-time click received via WebSocket');
                            // Trigger immediate data refresh
                            setTimeout(fetchData, 100);
                        }
                    } catch (e) {
                        console.error('❌ WebSocket message error:', e);
                    }
                };

                ws.onclose = () => {
                    console.log('🔌 WebSocket disconnected');
                    updateDebugInfo('ws', 'Disconnected');
                    scheduleReconnect();
                };

                ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                    updateDebugInfo('ws', 'Error');
                };

            } catch (error) {
                console.error('❌ WebSocket connection failed:', error);
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (reconnectAttempts < 5) {
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                reconnectAttempts++;

                setTimeout(() => {
                    if (navigator.onLine && channelId) {
                        console.log(`🔄 Reconnecting WebSocket (attempt ${reconnectAttempts})`);
                        connectWebSocket();
                    }
                }, delay);
            }
        }

        // Fetch data from server
        async function fetchData() {
            if (!channelId) return;

            try {
                const url = `${EBS}/heatmap?channel=${encodeURIComponent(channelId)}`;
                const response = await fetch(url, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {},
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('📊 Received data:', data);

                // Update running state
                const wasRunning = running;
                running = data.running;

                if (wasRunning !== running) {
                    console.log(`📊 Status changed: ${running ? 'RUNNING' : 'STOPPED'}`);
                    updateDebugInfo('status', running ? 'Running' : 'Stopped');
                    canvas.className = running ? '' : 'inactive';
                }

                // Update raw clicks
                if (data.rawClicks && Array.isArray(data.rawClicks)) {
                    rawClicks = data.rawClicks;
                    console.log(`📊 Received ${rawClicks.length} raw clicks`);
                    updateDebugInfo('clicks', rawClicks.length);

                    // Update clusters using our proper clustering algorithm
                    updateClusters();
                } else {
                    console.log('📊 No raw clicks in response');
                    updateDebugInfo('clicks', 0);
                }

            } catch (error) {
                if (DEBUG) {
                    console.error('❌ Fetch data error:', error);
                }
            }
        }

        // Update clusters using our ExMachinaClusterer
        function updateClusters() {
            console.log(`🧮 Clustering ${rawClicks.length} clicks...`);
            updateDebugInfo('render', 'Clustering...');

            try {
                // Use our proper clustering algorithm
                currentClusters = clusterer.clusterPoints(rawClicks);

                console.log(`🧮 Generated ${currentClusters.length} clusters:`, currentClusters);
                updateDebugInfo('clusters', currentClusters.length);
                updateDebugInfo('render', 'Rendering...');

                // Render using our proper renderer
                renderer.renderClusters(currentClusters);

                updateDebugInfo('render', 'Complete');

                // Log cluster details in debug mode
                if (DEBUG && currentClusters.length > 0) {
                    currentClusters.forEach((cluster, i) => {
                        console.log(`  Cluster ${i + 1}: ${cluster.percentage}% at (${cluster.centroid.x.toFixed(3)}, ${cluster.centroid.y.toFixed(3)})`);
                    });
                }

            } catch (error) {
                console.error('❌ Clustering/rendering error:', error);
                updateDebugInfo('render', 'Error');
            }
        }

        // Send click to server
        async function sendClick(x, y) {
            if (!authToken) {
                console.log('❌ No auth token, cannot send click');
                showNotification('Not authorized', 'error');
                return;
            }

            if (!running) {
                console.log('❌ System not running, cannot send click');
                showNotification('Click mapping not active', 'info');
                return;
            }

            try {
                console.log(`📤 Sending click: (${x.toFixed(3)}, ${y.toFixed(3)})`);

                const response = await fetch(`${EBS}/click`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ x, y })
                });

                if (response.ok) {
                    console.log('✅ Click sent successfully');
                    showNotification('Click registered!', 'success');

                    // Add click optimistically to local data
                    const userId = 'local_user_' + Math.random().toString(36).substr(2, 9);
                    rawClicks.push({ x, y, userId, timestamp: Date.now() });
                    updateClusters(); // Immediate local update

                    // Fetch fresh data from server
                    setTimeout(fetchData, 300);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.log(`❌ Click failed: ${response.status} - ${errorData.error || 'Unknown'}`);
                    showNotification(errorData.error || 'Click failed', 'error');
                }

            } catch (error) {
                console.error('❌ Click send error:', error);
                showNotification('Network error', 'error');
            }
        }

        // Handle canvas clicks
        canvas.addEventListener('click', (event) => {
            console.log('👆 Canvas clicked!');

            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;

            console.log(`📍 Click coordinates: (${x.toFixed(3)}, ${y.toFixed(3)})`);

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                sendClick(x, y);
            } else {
                console.log('❌ Click outside valid area');
            }
        });

        // Touch support
        canvas.addEventListener('touchend', (event) => {
            event.preventDefault();

            if (event.changedTouches.length === 1) {
                const touch = event.changedTouches[0];
                const rect = canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / rect.width;
                const y = (touch.clientY - rect.top) / rect.height;

                if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                    console.log('📱 Touch click:', x.toFixed(3), y.toFixed(3));
                    sendClick(x, y);
                }
            }
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Handle resize
        window.addEventListener('resize', () => {
            setTimeout(() => {
                renderer.handleResize();
                renderer.renderClusters(currentClusters);
            }, 100);
        });

        // Initialize system
        function initializeSystem() {
            console.log('🚀 Initializing  Smart Click Maps...');
            updateDebugInfo('status', 'Initializing...');

            if (window.Twitch && window.Twitch.ext) {
                console.log('✅ Twitch Extension API found');

                let authTimeout = setTimeout(() => {
                    console.log('⏰ Twitch auth timeout - using test mode');
                    updateDebugInfo('auth', 'Timeout');
                    channelId = 'test_channel';
                    updateDebugInfo('channel', channelId);
                    startDataSystem();
                }, 5000);

                Twitch.ext.onAuthorized((auth) => {
                    clearTimeout(authTimeout);

                    authToken = auth.token;
                    channelId = auth.channelId;

                    console.log(`🎪 Authorized for channel: ${channelId}`);
                    console.log(`🎫 Token present: ${!!authToken}`);

                    updateDebugInfo('auth', 'Yes');
                    updateDebugInfo('channel', channelId);

                    startDataSystem();
                });

            } else {
                console.log('⚠️ No Twitch Extension API - test mode');
                updateDebugInfo('auth', 'Test mode');
                channelId = 'test_channel';
                updateDebugInfo('channel', channelId);
                startDataSystem();
            }
        }

        function startDataSystem() {
            console.log('📡 Starting data system...');
            updateDebugInfo('status', 'Connected');

            // Connect WebSocket
            connectWebSocket();

            // Start polling
            fetchData(); // Initial fetch
            pollInterval = setInterval(fetchData, 2000);

            console.log('✅  system ready!');

            if (DEBUG) {
                showNotification(' Debug Mode Active', 'info');

                // Debug functions
                window.exMachina = {
                    sendTestClick: () => sendClick(Math.random(), Math.random()),
                    getStats: () => ({
                        running,
                        clusters: currentClusters.length,
                        clicks: rawClicks.length,
                        channelId,
                        hasAuth: !!authToken
                    }),
                    clearCanvas: () => renderer.renderClusters([]),
                    forceUpdate: updateClusters,
                    rawData: { rawClicks, currentClusters }
                };

                console.log('🐛 Debug functions available: window.exMachina');
            }
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
            if (pollInterval) clearInterval(pollInterval);
        });

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSystem);
        } else {
            initializeSystem();
        }

        console.log('🎯  Smart Click Maps v2.0 - Using proper heatmap.js!');
    </script>
</body>
</html>
