<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMap Control Panel</title>

    <!-- Preload Twitch Extension Helper -->
    <link rel="preload" href="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js" as="script">

    <!-- Twitch Extension Helper MUST BE FIRST -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <!-- Config Panel Styles -->
    <link rel="stylesheet" href="config.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>ClickMap</h1>
        <div class="subtitle">Interactive overlay control panel</div>
    </div>

    <!-- Connection Status Bar -->
    <div class="connection-status" id="connection-status">
        <span class="connection-dot"></span>
        <span id="connection-text">Connecting...</span>
        <span id="instance-id"></span>
    </div>

    <!-- Error Display -->
    <div class="error-message" id="error" style="display: none;">
        <span id="error-text">Connection error. Retrying...</span>
        <button id="error-retry" style="float: right;">Retry</button>
    </div>

    <!-- Status Section -->
    <div class="status-section">
        <div class="status-indicator" id="status">
            <div class="status-dot"></div>
            <span id="status-text">Initializing...</span>
        </div>
    </div>

    <!-- Statistics -->
    <div class="stats-section">
        <div class="stat-card">
            <span class="stat-value" id="total-clicks">-</span>
            <div class="stat-label">Total Clicks</div>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="unique-users">-</span>
            <div class="stat-label">Users</div>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="cluster-count">-</span>
            <div class="stat-label">Clusters</div>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="coverage">-</span>
            <div class="stat-label">Coverage</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-section">
        <div class="controls-header">Overlay Controls</div>
        <div class="controls">
            <div class="control-row">
                <button id="start-btn">▶️ Start</button>
                <button id="stop-btn" class="secondary">⏹️ Stop</button>
            </div>
            <button id="reset-btn" class="danger">🗑️ Reset</button>
        </div>
    </div>

    <!-- Overlay Settings -->
    <div class="overlay-controls">
        <h3>Settings</h3>
        <div class="control-group">
            <span class="control-label">Server</span>
            <span class="control-value" id="server-status">Connecting</span>
        </div>
        <div class="control-group">
            <span class="control-label">Overlay</span>
            <span class="control-value" id="overlay-status">Ready</span>
        </div>
        <div class="control-group">
            <span class="control-label">Threshold</span>
            <span class="control-value" id="threshold-value">3%</span>
        </div>
        <div class="control-group">
            <span class="control-label">Last Update</span>
            <span class="control-value" id="last-update">-</span>
        </div>
        <div class="control-group">
            <span class="control-label">Active Instances</span>
            <span class="control-value" id="active-instances">-</span>
        </div>
        <div class="control-group">
            <span class="control-label">State Version</span>
            <span class="control-value" id="state-version">-</span>
        </div>
    </div>

    <!-- All scripts come AFTER the Extension Helper -->
    <script src="heatmap.js"></script>
    <script src="config.js"></script>
</body>
</html>
