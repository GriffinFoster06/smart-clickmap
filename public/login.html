<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Streamer Login</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        form {
            background: #222;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            padding: .6rem;
            font-size: 1rem;
            width: 200px;
        }

        button {
            padding: .6rem;
            font-size: 1rem;
            cursor: pointer;
            background: #0a84ff;
            border: none;
            color: white;
        }

        #pwToggle {
            background: none;
            border: none;
            color: #0a84ff;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <form method="POST" action="/login">
        <h2>Clickmap Admin Login</h2>
        <input name="username" placeholder="Username" required>
        <div style="position:relative;">
            <input id="pw" name="password" type="password" placeholder="Password" required>
            <button type="button" id="pwToggle">👁️</button>
        </div>
        <button type="submit">Log in</button>
    </form>

    <script>
        document.getElementById('pwToggle').onclick = () => {
            const pw = document.getElementById('pw');
            pw.type = pw.type === 'password' ? 'text' : 'password';
            document.getElementById('pwToggle').textContent = pw.type === 'text' ? '🙈' : '👁️';
        };
    </script>
</body>
</html>
