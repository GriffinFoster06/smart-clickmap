<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Click on Stream</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden
        }

        #wrapper {
            position: relative;
            width: 100%;
            height: 100%
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: none;
            z-index: 0
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 1
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <iframe id="stream"></iframe>
        <canvas id="heat" width="1920" height="1080"></canvas>
    </div>

    <script type="module">
        import { getRoomId } from '/js/util.js';
        const user = getRoomId().replace(/^room-/, '');
        document.getElementById('stream').src =
            `https://player.twitch.tv/?channel=${user}&parent=${location.hostname}&muted=true`;
    </script>
    <script type="module" src="/js/heatmap.js"></script>
    <script type="module" src="/js/cluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <script type="module" src="/js/room.js"></script>
</body>
</html>
