<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMap Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Hidden loading (only visible in console) */
        .loading {
            display: none;
        }

        /* Hidden error message */
        .error-message {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Only the canvas - nothing else visible -->
    <canvas id="overlay-canvas"></canvas>

    <!-- Hidden elements for error handling -->
    <div class="loading" id="loading"></div>
    <div class="error-message" id="error">
        <p>Connection error</p>
    </div>

    <script src="overlay.js"></script>
</body>
</html>
