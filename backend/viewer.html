<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart Click Map Viewer</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://player.twitch.tv; style-src 'self' 'unsafe-inline';">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 0
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer
        }
    </style>
</head>
<body>
    <div id="container">
        <iframe id="player" sandbox="allow-scripts allow-same-origin" scrolling="no"></iframe>
        <canvas id="heat" width="1920" height="1080"></canvas>
        <canvas id="burst" width="1920" height="1080" style="pointer-events:none;position:absolute;top:0;left:0;z-index:3"></canvas>
        <div id="overlay"></div>
    </div>
    <script type="module" src="/click.js"></script>
</body>
</html>
