<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart Click Map Control</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #eee;
            padding: 20px;
            text-align: center
        }

        button, input {
            margin: 6px;
            padding: 8px;
            font-size: 16px
        }

        .cfg {
            margin-top: 20px;
            text-align: left;
            display: inline-block
        }
    </style>
</head>
<body>
    <h2>Control Panel</h2>
    <div>
        <button id="start">Start</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset</button>
    </div>
    <p id="status">Status: unknown</p>

    <div class="cfg">
        <h3>Appearance</h3>
        <label>Blob Color: <input type="color" id="blobColor"></label><br>
        <label>Top Color:  <input type="color" id="topColor"></label><br>
        <label>Threshold:  <input type="number" id="displayThreshold" min="0" max="100"></label><br>
        <button id="saveCfg">Save Settings</button>
    </div>

    <script type="module" src="/control.js"></script>
</body>
</html>
