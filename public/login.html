<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Streamer Login</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #222;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        input, button {
            padding: 0.6rem;
            font-size: 1rem;
            width: 200px;
        }

        button {
            background: #00cba9;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form method="POST" action="/login">
        <h2>Clickmap Admin Login</h2>
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Log in</button>
    </form>
</body>
</html>
