<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>ClickMap Control</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #eee;
            text-align: center;
            margin: 0;
            padding: 20px
        }

        button {
            background: #6441a5;
            color: #fff;
            border: none;
            font-size: 18px;
            padding: 10px 20px;
            margin: 6px;
            cursor: pointer
        }

        #stats {
            margin: 10px;
            font-size: 16px
        }
    </style>
</head>
<body>
    <div id="stats">0 clicks | 0 blobs</div>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
    <script type="module" src="/control.js"></script>
</body>
</html>
