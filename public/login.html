<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Streamer Login</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #222;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        input, button {
            padding: 0.6rem;
            font-size: 1rem;
            width: 200px;
        }

        button {
            background: #00cba9;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form method="POST" action="/login" style="display:flex;flex-direction:column;gap:1rem;">
        <h2>Click-Map Admin Login</h2>

        <label>
            <span>Username</span><br>
            <input name="username" required>
        </label>

        <label>
            <span>Password</span><br>
        </label>
        <div style="display:flex;align-items:center;gap:.3rem;">
            <input id="pwd" name="password" type="password" required style="flex:1;">
            <button id="toggle" type="button" style="padding:.4rem;">👁</button>
        </div>

        <button type="submit">Log in</button>
    </form>

    <script type="module">
        const pwd = document.getElementById('pwd');
        const btn = document.getElementById('toggle');
        btn.onclick = () => {
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
            btn.textContent = pwd.type === 'password' ? '🔒' : '🔓';
        };
    </script>

</body>
</html>
