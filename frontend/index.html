<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Click Map - Twitch Extension</title>

    <!-- Twitch Extension Helper Library -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <!-- Extension Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Preload important resources -->
    <link rel="preload" href="heatmap.js" as="script">
    <link rel="preload" href="script.js" as="script">
    <link rel="preload" href="debug.js" as="script">
</head>
<body>
    <!-- Main heatmap canvas - clean HUD-style overlay -->
    <canvas id="heat" width="1920" height="1080" aria-label="Interactive click heatmap overlay"></canvas>

    <!-- Hidden elements for functionality -->
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <span>Connecting...</span>
    </div>

    <div class="error-overlay" id="error-overlay" style="display: none;">
        <div class="error-content">
            <h3>⚠️ Connection Issue</h3>
            <p id="error-message">Unable to connect to ClickMap server.</p>
            <button id="retry-button">🔄 Retry</button>
        </div>
    </div>

    <!-- Accessibility announcements -->
    <div class="sr-only" id="announcements" aria-live="polite" aria-atomic="true"></div>

    <!-- Extension metadata for Twitch -->
    <script type="application/json" id="extension-manifest">
        {
            "name": "Smart ClickMap",
            "version": "2.0.0",
            "description": "Interactive HUD-style click heatmap overlay",
            "features": ["real-time", "hud-style", "interactive", "clustering"],
            "thresholds": {
                "default": 3,
                "minimum": 1,
                "maximum": 50
            }
        }
    </script>

    <!-- Structured data for better indexing -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Smart ClickMap",
            "applicationCategory": "Twitch Extension",
            "operatingSystem": "Web Browser",
            "permissions": "Interactive Overlay",
            "featureList": [
                "Real-time click visualization",
                "HUD-style overlay",
                "Adaptive clustering algorithm",
                "Touch and mouse support",
                "Accessibility features"
            ]
        }
    </script>

    <!-- Load scripts in order -->
    <script type="module" src="debug.js"></script>
    <script type="module" src="heatmap.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
