<details>
    <summary>Advanced Config</summary>
    <label>
        Min % shown:
        <input id="cfgPct" type="number" min="0" max="100" step="1" value="5">
    </label>
    <label>
        Max clusters:
        <input id="cfgMax" type="number" min="1" max="50" step="1" value="10">
    </label>
    <label>
        <input type="checkbox" id="cfgMerge" checked> Merge overlapping clusters
    </label>
    <button id="applyCfg">Apply (reload admin)</button>
    <button id="openViewer">Open Viewer</button>
    <button id="openOverlay">Open Overlay</button>
</details>
