<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Click Map - Twitch Extension</title>

    <!-- Twitch Extension Helper Library - MUST LOAD FIRST -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <!-- Extension Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main heatmap canvas - clean HUD-style overlay -->
    <canvas id="heat" width="1920" height="1080" aria-label="Interactive click heatmap overlay"></canvas>

    <!-- Hidden elements for functionality -->
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <span>Connecting...</span>
    </div>

    <div class="error-overlay" id="error-overlay" style="display: none;">
        <div class="error-content">
            <h3>⚠️ Connection Issue</h3>
            <p id="error-message">Unable to connect to ClickMap server.</p>
            <button id="retry-button">🔄 Retry</button>
        </div>
    </div>

    <!-- Accessibility announcements -->
    <div class="sr-only" id="announcements" aria-live="polite" aria-atomic="true"></div>

    <!-- Extension metadata for Twitch -->
    <script type="application/json" id="extension-manifest">
        {
            "name": "Smart ClickMap",
            "version": "2.0.0",
            "description": "Interactive HUD-style click heatmap overlay",
            "features": ["real-time", "hud-style", "interactive", "clustering"],
            "thresholds": {
                "default": 3,
                "minimum": 1,
                "maximum": 50
            }
        }
    </script>

    <!-- Structured data for better indexing -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Smart ClickMap",
            "applicationCategory": "Twitch Extension",
            "operatingSystem": "Web Browser",
            "permissions": "Interactive Overlay",
            "featureList": [
                "Real-time click visualization",
                "HUD-style overlay",
                "Adaptive clustering algorithm",
                "Touch and mouse support",
                "Accessibility features"
            ]
        }
    </script>

    <!-- Wait for Twitch Helper, then load modules -->
    <script>
        function waitForTwitchAndLoad() {
            if (typeof Twitch !== 'undefined' && Twitch.ext) {
                // Twitch Extension Helper is ready, now load our modules
                const scripts = [
                    'debug.js',
                    'heatmap.js',
                    'script.js'
                ];

                // Load modules sequentially
                let loadIndex = 0;
                function loadNext() {
                    if (loadIndex >= scripts.length) return;

                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = scripts[loadIndex];
                    script.onload = function () {
                        loadIndex++;
                        loadNext();
                    };
                    script.onerror = function () {
                        console.error('Failed to load script:', scripts[loadIndex]);
                        loadIndex++;
                        loadNext();
                    };
                    document.head.appendChild(script);
                }

                loadNext();
            } else {
                // Wait and try again
                setTimeout(waitForTwitchAndLoad, 100);
            }
        }

        // Start loading process
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', waitForTwitchAndLoad);
        } else {
            waitForTwitchAndLoad();
        }
    </script>
</body>
</html>
