<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Smart Click Maps</title>

    <!-- Twitch Extension Helper Library -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #heat {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 1000;
            cursor: crosshair;
        }

            #heat.inactive {
                cursor: not-allowed;
                opacity: 0.8;
            }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transform: translateX(110%);
            transition: all 0.3s ease;
        }

            .notification.show {
                opacity: 1;
                transform: translateX(0);
            }

            .notification.success {
                border-left: 4px solid #48bb78;
            }

            .notification.error {
                border-left: 4px solid #f56565;
            }

            .notification.info {
                border-left: 4px solid #4299e1;
            }

        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            z-index: 1900;
            display: none;
        }

            .debug-info.visible {
                display: block;
            }
    </style>
</head>
<body>
    <!-- Main canvas -->
    <canvas id="heat" width="1920" height="1080"></canvas>

    <!-- Debug info -->
    <div id="debug-info" class="debug-info">
        <div> Smart Click Maps</div>
        <div>Status: <span id="debug-status">Loading...</span></div>
        <div>Auth: <span id="debug-auth">Waiting...</span></div>
        <div>Channel: <span id="debug-channel">Unknown</span></div>
        <div>Clicks: <span id="debug-clicks">0</span></div>
        <div>WebSocket: <span id="debug-ws">Disconnected</span></div>
    </div>

    <script type="module">
        // Enable debug mode with ?debug=true
        const DEBUG = new URLSearchParams(location.search).has('debug');

        if (DEBUG) {
            document.getElementById('debug-info').classList.add('visible');
            console.log('🐛 Debug mode enabled');
        }

        // Global state
        let authToken = '';
        let channelId = '';
        let running = false;
        let currentClusters = [];

        // Backend configuration
        const EBS = 'https://smart-clickmap-backend.onrender.com';
        const wsUrl = EBS.replace('https://', 'wss://');

        // WebSocket and polling
        let ws = null;
        let pollInterval = null;
        let reconnectAttempts = 0;

        // Canvas and rendering
        const canvas = document.getElementById('heat');
        const ctx = canvas.getContext('2d');

        // Setup high DPI canvas
        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        }

        setupCanvas();

        //  style rendering
        function renderClusters(clusters) {
            const W = canvas.width / (window.devicePixelRatio || 1);
            const H = canvas.height / (window.devicePixelRatio || 1);

            ctx.clearRect(0, 0, W, H);

            if (!clusters || clusters.length === 0) return;

            clusters.forEach(cluster => {
                // Convert to pixel coordinates
                const cx = cluster.x * W;
                const cy = cluster.y * H;

                // Determine colors ( style)
                const isTop = cluster.isTop || cluster.rank === 1;
                const outlineColor = isTop ? '#00FFFF' : '#9D4EDD'; // Cyan or Purple
                const glowColor = outlineColor;

                // Draw glow effect
                ctx.save();
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = isTop ? 15 : 10;

                // Draw polygon or circle
                const radius = 30 + Math.sqrt(cluster.pct || cluster.percentage || 10) * 2;

                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = isTop ? 4 : 3;
                ctx.fillStyle = outlineColor + '10'; // Very transparent fill

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // Draw percentage text
                const fontSize = isTop ? 28 : 24;
                const text = `${cluster.pct || cluster.percentage || 0}%`;

                ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Text outline for readability
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.lineWidth = 4;
                ctx.strokeText(text, cx, cy);

                // Main text
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(text, cx, cy);
            });
        }

        // Simple clustering for fallback
        function createSimpleClusters(rawClicks) {
            if (!rawClicks || rawClicks.length === 0) return [];

            const totalClicks = rawClicks.length;
            const clusters = [];

            // Group nearby clicks (simple approach)
            const processed = new Set();

            rawClicks.forEach((click, i) => {
                if (processed.has(i)) return;

                const cluster = {
                    x: click.x,
                    y: click.y,
                    count: 1,
                    clicks: [click]
                };

                // Find nearby clicks
                for (let j = i + 1; j < rawClicks.length; j++) {
                    if (processed.has(j)) continue;

                    const distance = Math.sqrt(
                        Math.pow(click.x - rawClicks[j].x, 2) +
                        Math.pow(click.y - rawClicks[j].y, 2)
                    );

                    if (distance < 0.08) { // Cluster threshold
                        cluster.clicks.push(rawClicks[j]);
                        cluster.count++;
                        processed.add(j);
                    }
                }

                // Recalculate center
                if (cluster.count > 1) {
                    cluster.x = cluster.clicks.reduce((sum, c) => sum + c.x, 0) / cluster.count;
                    cluster.y = cluster.clicks.reduce((sum, c) => sum + c.y, 0) / cluster.count;
                }

                cluster.percentage = Math.round((cluster.count / totalClicks) * 100);

                if (cluster.percentage >= 8) { // Only show clusters with 8%+
                    clusters.push(cluster);
                    processed.add(i);
                }
            });

            // Sort by percentage and mark top
            clusters.sort((a, b) => b.percentage - a.percentage);
            clusters.forEach((cluster, index) => {
                cluster.rank = index + 1;
                cluster.isTop = index === 0;
            });

            return clusters.slice(0, 8); // Max 8 clusters
        }

        // Update debug info
        function updateDebugInfo(key, value) {
            if (DEBUG) {
                const element = document.getElementById(`debug-${key}`);
                if (element) element.textContent = value;
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            console.log(`📢 ${type.toUpperCase()}: ${message}`);

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 10);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        // WebSocket connection
        function connectWebSocket() {
            if (!channelId) return;

            try {
                const url = `${wsUrl}?channel=${encodeURIComponent(channelId)}`;
                console.log('🔌 Connecting WebSocket:', url);

                ws = new WebSocket(url);

                ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    updateDebugInfo('ws', 'Connected');
                    reconnectAttempts = 0;
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📨 WebSocket message:', data);

                        if (data.type === 'status') {
                            running = data.data.running;
                            updateDebugInfo('status', running ? 'Running' : 'Stopped');
                            canvas.className = running ? '' : 'inactive';
                        } else if (data.type === 'reset') {
                            currentClusters = [];
                            renderClusters(currentClusters);
                        }
                    } catch (e) {
                        console.error('WebSocket message error:', e);
                    }
                };

                ws.onclose = () => {
                    console.log('🔌 WebSocket disconnected');
                    updateDebugInfo('ws', 'Disconnected');
                    scheduleReconnect();
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateDebugInfo('ws', 'Error');
                };

            } catch (error) {
                console.error('WebSocket connection failed:', error);
                scheduleReconnect();
            }
        }

        // Schedule WebSocket reconnection
        function scheduleReconnect() {
            if (reconnectAttempts < 5) {
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                reconnectAttempts++;

                setTimeout(() => {
                    if (navigator.onLine && channelId) {
                        console.log(`🔄 Reconnecting WebSocket (attempt ${reconnectAttempts})`);
                        connectWebSocket();
                    }
                }, delay);
            }
        }

        // Fetch data from server
        async function fetchData() {
            if (!channelId) return;

            try {
                const url = `${EBS}/heatmap?channel=${encodeURIComponent(channelId)}`;
                const response = await fetch(url, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {},
                    cache: 'no-cache'
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                // Update running state
                const wasRunning = running;
                running = data.running;

                if (wasRunning !== running) {
                    console.log(`📊 Status changed: ${running ? 'RUNNING' : 'STOPPED'}`);
                    updateDebugInfo('status', running ? 'Running' : 'Stopped');
                    canvas.className = running ? '' : 'inactive';
                }

                // Process click data
                if (data.rawClicks && data.rawClicks.length > 0) {
                    console.log(`📊 Processing ${data.rawClicks.length} clicks`);
                    currentClusters = createSimpleClusters(data.rawClicks);
                    updateDebugInfo('clicks', data.rawClicks.length);
                } else if (data.blobs) {
                    currentClusters = data.blobs;
                    updateDebugInfo('clicks', data.totalClicks || 0);
                }

                // Render clusters
                renderClusters(currentClusters);

            } catch (error) {
                if (DEBUG) {
                    console.error('Fetch data error:', error);
                }
            }
        }

        // Send click to server
        async function sendClick(x, y) {
            if (!authToken) {
                console.log('❌ No auth token, cannot send click');
                showNotification('Not authorized', 'error');
                return;
            }

            if (!running) {
                console.log('❌ System not running, cannot send click');
                showNotification('Click mapping not active', 'info');
                return;
            }

            try {
                console.log(`📤 Sending click: (${x.toFixed(3)}, ${y.toFixed(3)})`);

                const response = await fetch(`${EBS}/click`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ x, y })
                });

                if (response.ok) {
                    console.log('✅ Click sent successfully');
                    showNotification('Click registered!', 'success');

                    // Immediate data refresh
                    setTimeout(fetchData, 200);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.log(`❌ Click failed: ${response.status} - ${errorData.error || 'Unknown'}`);
                    showNotification(errorData.error || 'Click failed', 'error');
                }

            } catch (error) {
                console.error('Click send error:', error);
                showNotification('Network error', 'error');
            }
        }

        // Handle canvas clicks
        canvas.addEventListener('click', (event) => {
            console.log('👆 Canvas clicked!');

            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;

            console.log(`📍 Click coordinates: (${x.toFixed(3)}, ${y.toFixed(3)})`);

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                sendClick(x, y);
            }
        });

        // Touch support
        canvas.addEventListener('touchend', (event) => {
            event.preventDefault();

            if (event.changedTouches.length === 1) {
                const touch = event.changedTouches[0];
                const rect = canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / rect.width;
                const y = (touch.clientY - rect.top) / rect.height;

                if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                    console.log('📱 Touch click:', x.toFixed(3), y.toFixed(3));
                    sendClick(x, y);
                }
            }
        });

        // Prevent context menu
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Handle resize
        window.addEventListener('resize', () => {
            setTimeout(() => {
                setupCanvas();
                renderClusters(currentClusters);
            }, 100);
        });

        // Initialize with Twitch Extension
        function initializeSystem() {
            console.log('🚀 Initializing  Smart Click Maps...');
            updateDebugInfo('status', 'Initializing...');

            if (window.Twitch && window.Twitch.ext) {
                console.log('✅ Twitch Extension API found');

                // Set up authorization with timeout
                let authTimeout = setTimeout(() => {
                    console.log('⏰ Twitch auth timeout - continuing without auth');
                    updateDebugInfo('auth', 'Timeout');
                    channelId = 'test_channel';
                    updateDebugInfo('channel', channelId);
                    startDataSystem();
                }, 5000); // 5 second timeout

                Twitch.ext.onAuthorized((auth) => {
                    clearTimeout(authTimeout);

                    authToken = auth.token;
                    channelId = auth.channelId;

                    console.log(`🎪 Authorized for channel: ${channelId}`);
                    console.log(`🎫 Token present: ${!!authToken}`);

                    updateDebugInfo('auth', 'Yes');
                    updateDebugInfo('channel', channelId);

                    startDataSystem();
                });

                Twitch.ext.onContext((context) => {
                    console.log('📱 Context changed:', context);
                });

            } else {
                console.log('⚠️ No Twitch Extension API - running in standalone mode');
                updateDebugInfo('auth', 'Standalone');
                channelId = 'test_channel';
                updateDebugInfo('channel', channelId);
                startDataSystem();
            }
        }

        // Start data system
        function startDataSystem() {
            console.log('📡 Starting data system...');
            updateDebugInfo('status', 'Connected');

            // Start WebSocket connection
            connectWebSocket();

            // Start polling
            fetchData(); // Initial fetch
            pollInterval = setInterval(fetchData, 2000);

            console.log('✅  system ready!');

            if (DEBUG) {
                showNotification(' Debug Mode Active', 'info');

                // Expose for debugging
                window.exMachina = {
                    sendTestClick: () => sendClick(0.5, 0.5),
                    getStats: () => ({ running, clusters: currentClusters.length, channelId, hasAuth: !!authToken }),
                    clearCanvas: () => renderClusters([])
                };
            }
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
            if (pollInterval) clearInterval(pollInterval);
        });

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSystem);
        } else {
            initializeSystem();
        }

        console.log('🎯  Smart Click Maps v2.0 loaded');
    </script>
</body>
</html>
