<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart ClickMap - OBS Browser Source</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            background: transparent;
        }

        /* Status indicators */
        .loading {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(147, 51, 234, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            z-index: 1001;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(239, 68, 68, 0.5);
        }

            .error-message h3 {
                margin-bottom: 10px;
                font-size: 18px;
            }

            .error-message p {
                margin: 5px 0;
                font-size: 14px;
                opacity: 0.9;
            }

        /* Optional stats overlay for debugging */
        .stats-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            z-index: 1000;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            .stats-overlay:hover {
                opacity: 1;
            }

            .stats-overlay div {
                margin: 2px 0;
            }

        /* Watermark (optional, can be removed) */
        .watermark {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            pointer-events: none;
            z-index: 999;
            backdrop-filter: blur(3px);
        }

        /* Hide watermark by adding ?nowatermark=1 to URL */
        .hide-watermark .watermark {
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 1280px) {
            .stats-overlay,
            .watermark,
            .loading {
                font-size: 9px;
                padding: 4px 8px;
            }

            .error-message {
                max-width: 300px;
                padding: 15px 20px;
            }
        }

        @media (max-width: 768px) {
            .stats-overlay,
            .loading {
                top: 5px;
                right: 5px;
                left: 5px;
                font-size: 8px;
            }

            .watermark {
                bottom: 5px;
                right: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Main canvas for heatmap visualization -->
    <canvas id="overlay-canvas"></canvas>

    <!-- Loading indicator -->
    <div class="loading" id="loading">
        🔄 Connecting to ClickMap Server...
    </div>

    <!-- Optional stats overlay (hidden by default) -->
    <div class="stats-overlay" id="stats" style="display: none;">
        <div>👥 Users: <span id="user-count">0</span></div>
        <div>🖱️ Clicks: <span id="click-count">0</span></div>
        <div>🎯 Hotspots: <span id="hotspot-count">0</span></div>
        <div>📊 Threshold: <span id="threshold">3%</span></div>
    </div>

    <!-- Error display -->
    <div class="error-message" id="error" style="display: none;">
        <h3>⚠️ Connection Error</h3>
        <p>Unable to connect to ClickMap server.</p>
        <p>Please check the channel parameter in the URL.</p>
        <p><strong>Example:</strong> ?channel=YOUR_TWITCH_CHANNEL</p>
    </div>

    <!-- Optional watermark -->
    <div class="watermark" id="watermark">Smart ClickMap v2</div>

    <!-- Load the overlay script -->
    <script src="overlay.js"></script>

    <script>
        // URL parameter handling for customization
        (function () {
            const params = new URLSearchParams(window.location.search);

            // Hide watermark if requested
            if (params.get('nowatermark') === '1' || params.get('watermark') === '0') {
                document.body.classList.add('hide-watermark');
            }

            // Show stats if requested
            if (params.get('stats') === '1' || params.get('debug') === '1') {
                document.getElementById('stats').style.display = 'block';
            }

            // Update threshold display
            const threshold = params.get('threshold') || '3';
            const thresholdEl = document.getElementById('threshold');
            if (thresholdEl) thresholdEl.textContent = threshold + '%';

            // Console info for setup
            console.log('🎯 Smart ClickMap OBS Overlay v2.0.0');
            console.log('📋 URL Parameters:');
            console.log('   ?channel=CHANNEL_NAME (required)');
            console.log('   &threshold=5 (optional, default: 3)');
            console.log('   &stats=1 (show debug stats)');
            console.log('   &nowatermark=1 (hide watermark)');

            const channel = params.get('channel') || params.get('c');
            if (channel) {
                console.log(`🔗 Connected to channel: ${channel}`);
            } else {
                console.warn('⚠️  No channel specified in URL!');
            }
        })();
    </script>
</body>
</html>
