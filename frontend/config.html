<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Click Map Control</title>

    <!-- ✅ Load the Twitch Extension Helper Library -->

    <style>
        body {
            font-family: sans-serif;
            margin: 10px;
        }

        button {
            margin: 4px 0;
            padding: 8px 14px;
            font-size: 16px;
            width: 100%;
        }
