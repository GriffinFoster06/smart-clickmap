<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <style>
        body, html {
            margin: 0;
            background: transparent;
            overflow: hidden; /* Prevent scrollbars if canvas overflows */
        }

        canvas {
            display: block; /* Prevent extra space below canvas */
            width: 100vw; /* Make canvas responsive */
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="heat" width="1920" height="1080"></canvas>
    <script type="module" src="/overlay.js"></script>
</body>
</html>
