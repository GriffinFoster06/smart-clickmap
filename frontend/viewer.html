<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Click Map</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script type="module" src="./heatmap.js"></script>
</head>
<body>
    <div class="layout">
        <div id="player"></div>
        <canvas id="heat" width="1280" height="720"></canvas>
    </div>
    <script type="module">
        import { drawBlobs } from './heatmap.js';
        const api = 'https://api.phummylw.com';
        const chan = location.pathname.split('/').pop().toLowerCase();
        /* Twitch embed */
        new Twitch.Embed("player", { channel: chan, width: "100%", height: "100%", layout: "video" });
        const canvas = document.getElementById('heat');
        const ctx = canvas.getContext('2d');
        canvas.addEventListener('click', e => {
            const r = canvas.getBoundingClientRect();
            fetch(`${api}/click/${chan}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height })
            });
        });
        async function poll() {
            const j = await (await fetch(`${api}/heatmap/${chan}`)).json();
            drawBlobs(ctx, j.blobs || []);
        }
        setInterval(poll, 1000); poll();
    </script>
</body>
</html>
