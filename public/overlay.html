<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OBS Overlay</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="heat" width="1920" height="1080"></canvas>

    <script type="module" src="/js/cluster.js"></script>
    <script type="module" src="/js/heatmap.js"></script>
    <script type="module" src="/js/overlay.js"></script>
</body>
</html>
